<style>
/* Layout: same visual system as the catalog — sidebar-free, two tabs: model-by-model matches, then the market */
:root{
  --paper:#EEF0EC; --surface:#F8F9F6; --ink:#1F2420; --muted:#6B7069; --line:#D4D8D0;
  --accent:#55704F; --accent-ink:#F4F6F2; --tile:#E2E5DE; --hover:#E7EAE3; --bar:#6E8B67; --bar-ours:#A87526;
  --st-active:#4E7A4A; --st-work:#A87526;
  --radius-s:6px; --radius-m:10px;
  --font:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151816; --surface:#1C201D; --ink:#E7EBE4; --muted:#9BA197; --line:#2D332E;
    --accent:#9DB596; --accent-ink:#151816; --tile:#242925; --hover:#232824; --bar:#8FAE87; --bar-ours:#D4A355;
    --st-active:#86B07F; --st-work:#D4A355; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151816; --surface:#1C201D; --ink:#E7EBE4; --muted:#9BA197; --line:#2D332E;
  --accent:#9DB596; --accent-ink:#151816; --tile:#242925; --hover:#232824; --bar:#8FAE87; --bar-ours:#D4A355;
  --st-active:#86B07F; --st-work:#D4A355; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding-inline:24px;padding-block:20px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1}
.brand span{color:var(--muted);font-size:16px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.meta a{font-weight:500}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--surface);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.chip small{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.note{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:80ch}

/* matches */
.model{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px;margin-bottom:12px}
.ours .ph{aspect-ratio:4/3;border-radius:var(--radius-s);background:var(--tile);overflow:hidden}
.ours .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ours h3{margin:8px 0 4px;font-size:15px;line-height:1.3}
.attrs{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--paper);border-radius:4px;padding:2px 6px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.right{min-width:0}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.sum b{color:var(--ink);font-weight:600}
.comps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.comp{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--paper);display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.comp:hover{border-color:var(--muted)}
.comp .im{aspect-ratio:3/4;max-height:180px;background:#fff;border-radius:var(--radius-s) var(--radius-s) 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.comp .im img{width:100%;height:100%;object-fit:contain}
.comp .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.comp .brandn{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;min-height:2.6em}
.comp .pr{font-size:16px;font-weight:600}
.comp .kv{display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
.comp .kv b{color:var(--ink);font-weight:500}
.comp .go{margin-top:4px;color:var(--accent);font-weight:500}
.none{color:var(--muted);font-size:13px}

/* market */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px}
.tile .n{font-size:26px;font-weight:600;letter-spacing:-0.02em}
.tile .l{color:var(--muted);font-size:13px}
h2{font-size:18px;margin:22px 0 6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
td.barcell{width:32%;min-width:160px;text-align:left}
.bwrap{display:flex;align-items:center;gap:8px}
.bwrap span{min-width:86px;text-align:right}
.btrack{flex:1;height:10px;background:var(--tile);border-radius:0 4px 4px 0;position:relative}
.bfill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0}
.ourspill{display:inline-block;min-width:22px;text-align:center;border-radius:999px;padding:1px 8px;background:var(--tile)}
.ourspill.zero{color:var(--st-work);background:transparent;border:1px dashed var(--st-work)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
.cols > div{min-width:0}
[hidden]{display:none!important}
@media (max-width:760px){
  .wrap{padding-inline:16px}
  .model{grid-template-columns:1fr}
  .ours{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
  .ours h3{margin-top:0}
  .cols{grid-template-columns:1fr}
  .brand h1{font-size:26px}
}

:root{--go:#3F7A44;--care:#A87526;--risk:#B0473A;--nod:#7B8078;--hl:#FFF3D6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--go:#86B07F;--care:#D4A355;--risk:#E07A6C;--nod:#9BA197;--hl:#2E2818}}
:root[data-theme="dark"]{--go:#86B07F;--care:#D4A355;--risk:#E07A6C;--nod:#9BA197;--hl:#2E2818}
.model.launch{border:2px solid var(--care);box-shadow:0 0 0 3px var(--hl)}
.lbadge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;background:var(--care);color:#fff;border-radius:4px;padding:2px 7px;margin-bottom:6px}
.verdict{display:flex;gap:10px;align-items:flex-start;background:var(--hl);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.4}
.vpill{flex:none;font-weight:600;font-size:13px;color:#fff;background:var(--vc);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.lchip{border-color:var(--care)}
.chip.lchip[aria-pressed="true"]{background:var(--care);border-color:var(--care);color:#fff}
.bench{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.bench h4{margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.bench p{margin:0 0 8px;font-size:14px;line-height:1.4}
.bench .comps{grid-auto-columns:minmax(170px,210px)}
.bsum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;margin:0 0 16px}
.bsum summary{cursor:pointer;font-weight:600;font-size:15px}
.bsum table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0}
.bsum th,.bsum td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.bsum .tw{overflow-x:auto}
.comps{grid-auto-columns:minmax(200px,1fr)}
.comp .kv{font-size:12.5px}
.comp .kv b{white-space:nowrap}
.comp .pr small{display:block}
.bsum ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
</style>

(function(){
"use strict";
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function rub(n){ return Math.round(n).toLocaleString("ru-RU") + " ₽"; }
function num(n){ return Math.round(n).toLocaleString("ru-RU"); }
function mln(n){ return (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1}) + " млн ₽"; }
function tys(n){ return Math.round(n/1000).toLocaleString("ru-RU") + " тыс ₽"; }

$("period").textContent = "MPStats · бренды " + BR.period + " · рынок " + D.period;

var MN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function dstr(s){ if(!s) return "—"; var p=s.split("-"); return (+p[2])+" "+MN[(+p[1])-1]+" "+p[0]; }
function months(s){ if(!s) return null; var d=new Date(s), n=new Date(BR.period.slice(11).split(".").reverse().join("-"));
  return Math.max(0, Math.round((n-d)/2629800000)); }
function age(s){ var m=months(s); if(m===null) return ""; if(m<1) return "меньше месяца"; if(m<12) return m+" мес."; var y=Math.floor(m/12); return y+" "+(y===1?"год":(y<5?"года":"лет"))+(m%12?" "+(m%12)+" мес.":""); }

var S = { mode:"best", brand:"", q:"", minRev:true };
BR.items.sort(function(a,b){ return b.rev-a.rev; });
function pool(){ return BR.items.filter(function(x){ return !S.minRev || x.rev>=1e6; }); }

function card(it, isNew){
  var id=it[0], nm=it[1], p=it[2], rev=it[3], s=it[4], spd=it[5], f=it[6], bal=it[7], img=it[8];
  return '<a class="comp" href="https://www.wildberries.ru/catalog/'+id+'/detail.aspx" target="_blank" rel="noopener" title="'+esc(nm)+'">'+
    '<div class="im">'+(img?'<img alt="" loading="lazy" referrerpolicy="no-referrer" src="'+esc(img)+'">':'')+'</div>'+
    '<div class="b">'+
    (isNew?'<span class="lbadge">новинка</span>':'')+
    '<span class="nm">'+esc(nm)+'</span>'+
    '<span class="pr">'+rub(p)+'</span>'+
    '<span class="kv">Выручка <b>'+tys(rev)+'</b></span>'+
    '<span class="kv">Заказы <b>'+num(s)+' шт</b></span>'+
    '<span class="kv">В день <b>'+String(spd).replace(".",",")+' шт</b></span>'+
    '<span class="kv">Остаток <b>'+num(bal)+' шт</b></span>'+
    '<span class="kv">Выведена <b>'+dstr(f)+'</b></span>'+
    '<span class="kv">Возраст <b>'+age(f)+'</b></span>'+
    '<span class="go">Открыть на WB ↗</span></div></a>';
}

function chips(){
  var modes=[["best","Бестселлеры"],["new","Новинки"],["both","И то, и другое"]];
  $("modeChips").innerHTML = modes.map(function(m){
    return '<button class="chip lchip" data-mode="'+m[0]+'" aria-pressed="'+(S.mode===m[0])+'">'+m[1]+'</button>'; }).join("")
    + '<button class="chip" data-min="1" aria-pressed="'+S.minRev+'" title="Скрыть бренды с выручкой меньше 1 млн за месяц">от 1 млн ₽ за месяц</button>';
  var P = pool();
  $("brandChips").innerHTML = '<button class="chip" data-brand="" aria-pressed="'+(!S.brand)+'">Все бренды <small>'+P.length+'</small></button>'+
    P.map(function(x){ return '<button class="chip" data-brand="'+esc(x.b)+'" aria-pressed="'+(S.brand===x.b)+'">'+esc(x.b)+' <small>'+mln(x.rev)+'</small></button>'; }).join("");
}

function tiles(){
  var list = pool();
  var rev = list.reduce(function(a,x){return a+x.rev;},0);
  var cards = list.reduce(function(a,x){return a+x.n;},0);
  var nn = list.reduce(function(a,x){return a+x.newCount;},0);
  var meds = list.map(function(x){return x.med;}).sort(function(a,b){return a-b;});
  $("btiles").innerHTML = [
    [mln(rev), list.length+" брендов — выручка за месяц"],
    [num(cards)+" шт", "карточек в продаже"],
    [num(nn)+" шт", "из них выведены в 2026 году"],
    [rub(meds[Math.floor(meds.length/2)]), "медиана медианных цен"]
  ].map(function(x){ return '<div class="tile"><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>'; }).join("");
}

function renderBrands(){
  var q = S.q.toLowerCase();
  var list = pool().filter(function(x){ return !S.brand || x.b===S.brand; });
  var html = list.map(function(x){
    function sect(title, arr, isNew){
      if(!arr.length) return '<div class="bench"><h4>'+title+'</h4><p class="none">За период ничего не подошло.</p></div>';
      var f = arr.filter(function(it){ return !q || (it[1]+" "+x.b).toLowerCase().indexOf(q)>=0; });
      if(!f.length) return "";
      return '<div class="bench"><h4>'+title+'</h4><div class="comps">'+f.map(function(it){return card(it,isNew);}).join("")+'</div></div>';
    }
    var body = "";
    if(S.mode==="best"||S.mode==="both") body += sect("Бестселлеры месяца", x.best, false);
    if(S.mode==="new"||S.mode==="both") body += sect("Новинки с "+MN[(+BR.newFrom.split(".")[1])-1]+" "+BR.newFrom.split(".")[2], x.nw, true);
    if(!body) return "";
    return '<article class="model"><div class="ours">'+
      '<h3>'+esc(x.b)+'</h3>'+
      '<div class="attrs"><span class="tag">'+mln(x.rev)+' за месяц</span>'+
      '<span class="tag">'+num(x.n)+' карточек</span>'+
      '<span class="tag">медиана '+rub(x.med)+'</span>'+
      '<span class="tag">'+num(x.newCount)+' новых в 2026</span></div>'+
      '</div><div class="right">'+body+'</div></article>';
  }).join("");
  $("blist").innerHTML = html || '<p class="none">Ничего не найдено.</p>';
}

$("bnote").textContent = "Десять лидеров нашей цены — те же бренды, что в годовом разборе. Бестселлеры — пять карточек с наибольшей выручкой за месяц. Новинки — выведенные за последние три месяца и успевшие набрать продажи, самые свежие сверху. Учтены только категории очков и цена 800–2 000 ₽ — наш коридор. По умолчанию показаны бренды с выручкой от 1 млн ₽ за месяц — переключатель рядом с фильтрами снимает это ограничение. Заказы — оценка MPStats по открытым данным WB, не выкупы.";

function barRow(label, v, max, extra){
  return '<td>'+esc(label)+'</td><td class="barcell"><div class="bwrap" title="'+esc(label)+': '+mln(v)+'"><div class="btrack"><div class="bfill" style="width:'+(max? (v/max*100).toFixed(1):0)+'%"></div></div><span>'+mln(v)+'</span></div></td>'+extra;
}
function renderMarket(){

    [rub(t.p25)+" – "+rub(t.p75), "основной ценовой коридор"]
  ].map(function(x){ return '<div class="tile"><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>'; }).join("");
  $("formNote").textContent = "Форма определена по названию карточки: она указана у "+D.named+" из 3000 товаров, поэтому суммы показывают пропорции, а не весь рынок. «Наших» — моделей в каталоге с этой основной формой (в продаже / всего).";
  var fs = D.forms.slice().sort(function(a,b){return b.rev-a.rev;}), mx = fs[0].rev;
  $("tForms").innerHTML = '<thead><tr><th>Форма</th><th style="text-align:left">Выручка</th><th>Карточек</th><th>Заказы</th><th>Медианная цена</th><th>Выручка на карточку</th><th>Наших</th></tr></thead><tbody>'+
    fs.map(function(f){ return '<tr>'+barRow(f.k, f.rev, mx, '<td>'+num(f.n)+'</td><td>'+num(f.ord)+'</td><td>'+rub(f.p50)+'</td><td>'+rub(f.rv50)+'</td><td><span class="ourspill'+(f.ours?'':' zero')+'">'+f.ours_sale+' / '+f.ours+'</span></td>')+'</tr>'; }).join("")+'</tbody>';
  var bs = D.bands, bm = Math.max.apply(null, bs.map(function(b){return b.rev;}));
  $("tBands").innerHTML = '<thead><tr><th>Цена</th><th style="text-align:left">Выручка</th><th>Карточек</th><th>Заказы</th></tr></thead><tbody>'+
    bs.map(function(b){ return '<tr>'+barRow(b.k, b.rev, bm, '<td>'+num(b.n)+'</td><td>'+num(b.ord)+'</td>')+'</tr>'; }).join("")+'</tbody>';
  var ts = D.types, tm = Math.max.apply(null, ts.map(function(b){return b.rev;}));
  $("tTypes").innerHTML = '<thead><tr><th>В названии</th><th style="text-align:left">Выручка</th><th>Карточек</th><th>Медианная цена</th></tr></thead><tbody>'+
    ts.map(function(b){ return '<tr>'+barRow(b.k, b.rev, tm, '<td>'+num(b.n)+'</td><td>'+rub(b.p50)+'</td>')+'</tr>'; }).join("")+'</tbody>';
  var br = D.brands, brm = br[0][2];
  $("tBrands").innerHTML = '<thead><tr><th>Бренд</th><th style="text-align:left">Выручка</th><th>Карточек в топ-3000</th><th>Заказы</th></tr></thead><tbody>'+
    br.map(function(b){ return '<tr>'+barRow(b[0], b[2], brm, '<td>'+num(b[1])+'</td><td>'+num(b[3])+'</td>')+'</tr>'; }).join("")+'</tbody>';
}
function tab(which){
  $("tabMatch").setAttribute("aria-pressed", String(which==="match"));
  $("tabMarket").setAttribute("aria-pressed", String(which==="market"));
  $("match").hidden = which!=="match"; $("market").hidden = which!=="market";
}
$("tabMatch").addEventListener("click", function(){ tab("match"); });
$("tabMarket").addEventListener("click", function(){ tab("market"); });
$("modeChips").addEventListener("click", function(e){
  var m=e.target.closest("[data-mode]");
  if(m){ S.mode=m.dataset.mode; chips(); renderBrands(); return; }
  var t=e.target.closest("[data-min]");
  if(t){ S.minRev=!S.minRev; if(S.brand && !pool().some(function(x){return x.b===S.brand;})) S.brand=""; chips(); tiles(); renderBrands(); }
});
$("brandChips").addEventListener("click", function(e){ var b=e.target.closest("[data-brand]"); if(!b) return; S.brand=b.dataset.brand; chips(); renderBrands(); });
var qt; $("q").addEventListener("input", function(e){ clearTimeout(qt); qt=setTimeout(function(){ S.q=e.target.value.trim(); renderBrands(); },120); });
if(location.hash==="#market") tab("market");
chips(); tiles(); renderBrands(); renderMarket();
})();
</script>

</body></html>
